<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir Salon Alesha Online</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#db2777">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* Mencegah refresh otomatis saat layar ditarik ke bawah */
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #f8fafc; 
      overscroll-behavior-y: none; 
      touch-action: pan-x pan-y;
    }
    .tab-konten { display: none; }
    .tab-konten.active { display: block; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b border-slate-200/50 p-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">💇‍♀️</span>
        <h1 class="text-lg font-extrabold text-pink-600 uppercase tracking-tighter">Salon Alesha</h1>
      </div>
      <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="bukaTab(event, 'kasir')" class="nav-btn px-4 py-2 rounded-lg text-xs font-bold transition bg-white text-pink-600 shadow-sm">Kasir</button>
        <button onclick="bukaTab(event, 'riwayat')" class="nav-btn px-4 py-2 rounded-lg text-xs font-bold transition text-slate-500">Laporan</button>
      </div>
    </div>
  </nav>

  <div id="loader" class="hidden fixed inset-0 bg-white/60 backdrop-blur-sm z-[100] flex items-center justify-center font-bold text-pink-600 italic">
    <div class="p-5 bg-white rounded-2xl shadow-xl border border-pink-100 text-center">Memproses Cloud... ☁️</div>
  </div>

  <div class="max-w-2xl mx-auto p-4">
    
    <div id="tab-kasir" class="tab-konten active space-y-4">
      <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100">
        <h2 class="font-bold mb-4 flex items-center gap-2"><span class="bg-pink-100 p-1 rounded text-pink-600">📝</span> Transaksi Baru</h2>
        <div class="space-y-3">
          <div>
            <label for="inpNama" class="block text-[10px] font-bold text-slate-400 ml-2 mb-1 uppercase">Nama Pelanggan</label>
            <input type="text" id="inpNama" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-pink-500" placeholder="Ketik nama...">
          </div>
          <div>
            <label for="inpHp" class="block text-[10px] font-bold text-slate-400 ml-2 mb-1 uppercase">Nomor WhatsApp</label>
            <input type="tel" id="inpHp" class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-pink-500" placeholder="0812...">
          </div>
          <div>
            <label for="inpLayanan" class="block text-[10px] font-bold text-slate-400 ml-2 mb-1 uppercase">Pilih Treatment</label>
            <select id="inpLayanan" class="w-full p-4 bg-slate-50 rounded-2xl outline-none ring-1 ring-slate-100">
              <option value="">-- Pilih --</option>
              <option value="Potong Rambut">Potong Rambut</option>
              <option value="Cuci Catok / Blow">Cuci Catok / Blow</option>
              <option value="Creambath">Creambath</option>
              <option value="Hair Mask / Spa">Hair Mask / Spa</option>
              <option value="Smoothing / Matrix">Smoothing / Matrix</option>
              <option value="Coloring / Highlight">Coloring / Highlight</option>
              <option value="Eyelash / Nail Art">Eyelash / Nail Art</option>
              <option value="Lainnya (Custom)">Lainnya (Custom)</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mt-3">
          <div>
            <label for="inpHarga" class="text-[10px] font-bold text-slate-400 ml-2 mb-1 uppercase block">Harga (Rp)</label>
            <input type="text" inputmode="numeric" id="inpHarga" oninput="formatRpInput(this); hitung()" class="w-full p-4 bg-white border-2 border-pink-100 rounded-2xl font-bold text-pink-600 outline-none" placeholder="0">
          </div>
          <div>
            <label for="inpDiskon" class="text-[10px] font-bold text-orange-400 ml-2 mb-1 uppercase block">Diskon (Rp)</label>
            <input type="text" inputmode="numeric" id="inpDiskon" oninput="formatRpInput(this); hitung()" class="w-full p-4 bg-orange-50 border border-orange-200 rounded-2xl text-orange-600 font-bold outline-none" placeholder="0">
          </div>
        </div>
      </div>

      <div class="bg-slate-900 text-white p-8 rounded-[2rem] shadow-2xl">
        <p class="text-slate-400 text-xs font-bold uppercase mb-1">Total Tagihan</p>
        <h3 id="txtTotal" class="text-4xl font-black text-pink-400 mb-6 tracking-tight">Rp 0</h3>
        <div class="space-y-4">
          <div>
            <label for="inpBayar" class="block text-[10px] text-slate-400 ml-2 mb-1 uppercase">Uang Tunai</label>
            <input type="text" inputmode="numeric" id="inpBayar" oninput="formatRpInput(this); hitung()" class="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 font-bold text-xl text-white outline-none" placeholder="Rp 0">
          </div>
          <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-2xl">
            <span class="text-xs text-slate-400">Kembalian:</span>
            <span id="txtKembali" class="font-bold text-xl text-emerald-400">Rp 0</span>
          </div>
        </div>
        <button onclick="simpan()" class="w-full mt-6 bg-gradient-to-r from-pink-500 to-rose-600 py-5 rounded-2xl font-extrabold shadow-lg shadow-pink-500/30 active:scale-95 transition-all flex items-center justify-center gap-2">
          SIMPAN & KIRIM NOTA 📲
        </button>
      </div>
    </div>

    <div id="tab-riwayat" class="tab-konten space-y-4">
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-3">
        <p class="text-[10px] font-bold text-slate-400 uppercase ml-1">Filter Laporan</p>
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
          <button onclick="setFilter('semua')" id="btn-f-semua" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-pink-500 text-white transition-all whitespace-nowrap">Semua</button>
          <button onclick="setFilter('hari_ini')" id="btn-f-hari_ini" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-500 transition-all whitespace-nowrap">Hari Ini</button>
        </div>
        <div class="pt-2 border-t border-slate-50">
          <label class="text-[10px] font-bold text-slate-400 uppercase ml-1 mb-1 block">Cari Tanggal Spesifik</label>
          <input type="date" id="filterTgl" onchange="setFilter('kalender')" class="w-full p-3 bg-slate-50 rounded-xl outline-none text-sm font-bold text-slate-600 border border-slate-100">
        </div>
      </div>

      <div class="bg-emerald-500 text-white p-6 rounded-[2rem] shadow-lg relative overflow-hidden">
        <p class="text-[10px] font-bold uppercase opacity-80 mb-1">Total Omset</p>
        <h4 id="txtOmset" class="text-3xl font-black">Rp 0</h4>
        <div class="absolute right-[-10px] bottom-[-10px] text-6xl opacity-10 rotate-12">💰</div>
      </div>
      <div id="listRiwayat" class="space-y-3 pb-20"></div>
    </div>
  </div>

  <script>
    const SHEETS_URL = "https://script.google.com/macros/s/AKfycbwk13_OZwnmngluCPTFehZrcZaMcJngFQlUDMZXjUEeh196q1d3AfOV-HPiEDjc360yfQ/exec"; 
    let dTransaksi = JSON.parse(localStorage.getItem('alesha_data')) || [];
    let currentFilter = 'semua';

    function putarSuaraTing() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, ctx.currentTime);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    function formatRp(n) { return new Intl.NumberFormat('id-ID').format(n); }
    function clean(s) { return parseInt(String(s).replace(/\./g, '')) || 0; }
    function formatRpInput(i) { 
      let v = i.value.replace(/[^0-9]/g, '');
      i.value = v ? formatRp(v) : '';
    }

    function bukaTab(e, t) {
      document.querySelectorAll('.tab-konten').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-'+t).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-pink-600', 'shadow-sm');
        btn.classList.add('text-slate-500');
      });
      if(e) e.currentTarget.classList.add('bg-white', 'text-pink-600', 'shadow-sm');
      if(t === 'riwayat') renderRiwayat();
    }

    function hitung() {
      let h = clean(document.getElementById('inpHarga').value);
      let d = clean(document.getElementById('inpDiskon').value);
      let b = clean(document.getElementById('inpBayar').value);
      let t = Math.max(0, h - d);
      document.getElementById('txtTotal').innerText = 'Rp ' + formatRp(t);
      document.getElementById('txtKembali').innerText = 'Rp ' + formatRp(Math.max(0, b - t));
    }

    async function muatData() {
      if(dTransaksi.length === 0) showLoader(true);
      try {
        const res = await fetch(SHEETS_URL);
        dTransaksi = await res.json();
        localStorage.setItem('alesha_data', JSON.stringify(dTransaksi));
        renderRiwayat();
      } catch (e) {}
      showLoader(false);
    }

    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.replace('bg-pink-500', 'bg-slate-100');
        btn.classList.replace('text-white', 'text-slate-500');
      });
      if (f !== 'kalender') {
        document.getElementById('btn-f-'+f).classList.replace('bg-slate-100', 'bg-pink-500');
        document.getElementById('btn-f-'+f).classList.replace('text-slate-500', 'text-white');
        document.getElementById('filterTgl').value = ''; // Reset kalender jika pilih tombol
      }
      renderRiwayat();
    }

    function renderRiwayat() {
      const now = new Date();
      const tglSkrg = now.toLocaleDateString('id-ID');
      
      let filtered = dTransaksi;
      if (currentFilter === 'hari_ini') {
        filtered = dTransaksi.filter(t => t.Tanggal === tglSkrg);
      } else if (currentFilter === 'kalender') {
        const val = document.getElementById('filterTgl').value; // Format: YYYY-MM-DD
        if (val) {
          const parts = val.split('-');
          const tglTarget = `${parseInt(parts[2])}/${parseInt(parts[1])}/${parts[0]}`; // Ubah ke D/M/YYYY
          filtered = dTransaksi.filter(t => t.Tanggal === tglTarget);
        }
      }

      let omset = 0;
      let h = '';
      filtered.slice().reverse().forEach(t => {
        omset += parseInt(t["Total Tagihan"] || 0);
        h += `<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center transition-all">
                <div>
                  <p class="text-[10px] text-slate-400 font-bold">${t.Tanggal} • ${t["ID Nota"] || 'NOTA'}</p>
                  <p class="font-bold text-slate-700">${t.Pelanggan}</p>
                  <p class="text-xs text-pink-500 font-medium">${t.Treatment}</p>
                </div>
                <div class="text-right">
                  <p class="font-black text-slate-800">Rp ${formatRp(t["Total Tagihan"])}</p>
                  <button onclick="hapus('${t["ID Nota"]}')" class="text-[10px] font-bold text-rose-500 bg-rose-50 px-2 py-1 rounded-lg mt-1">Hapus</button>
                </div>
              </div>`;
      });
      document.getElementById('txtOmset').innerText = 'Rp ' + formatRp(omset);
      document.getElementById('listRiwayat').innerHTML = h || '<p class="text-center text-slate-400 py-10">Data tidak ditemukan</p>';
    }

    function generateNotaID() {
      const d = new Date();
      const tglKey = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
      let lastDate = localStorage.getItem('alesha_last_date');
      let lastSeq = parseInt(localStorage.getItem('alesha_last_seq')) || 0;
      if (lastDate !== tglKey) {
        lastSeq = 1;
      } else {
        lastSeq++;
      }
      localStorage.setItem('alesha_last_date', tglKey);
      localStorage.setItem('alesha_last_seq', lastSeq);
      return `ALSH-${tglKey}-${String(lastSeq).padStart(3, '0')}`;
    }

    async function simpan() {
      const nama = document.getElementById('inpNama').value;
      const hp = document.getElementById('inpHp').value;
      const lay = document.getElementById('inpLayanan').value;
      const harga = clean(document.getElementById('inpHarga').value);
      const diskon = clean(document.getElementById('inpDiskon').value);
      const total = harga - diskon;
      if(!nama || !hp || !lay || harga <= 0) return alert('Lengkapi data!');
      putarSuaraTing();
      let id = generateNotaID();
      let waHp = hp.startsWith('0') ? '62' + hp.substring(1) : hp;
      let tgl = new Date().toLocaleDateString('id-ID');
      dTransaksi.push({ "Tanggal": tgl, "ID Nota": id, "Pelanggan": nama, "No WA": waHp, "Treatment": lay, "Diskon": diskon, "Total Tagihan": total });
      localStorage.setItem('alesha_data', JSON.stringify(dTransaksi));
      fetch(SHEETS_URL, {
        method: 'POST',
        body: JSON.stringify({ tanggal: tgl, idNota: id, pelanggan: nama, noWa: waHp, layanan: lay, diskon: diskon, totalAkhir: total })
      });
      const msg = `*NOTA SALON ALESHA* 💇‍♀️%0A--------------------------------%0A*ID Nota:* ${id}%0A*Tanggal:* ${tgl}%0A%0A👤 *Pelanggan:* ${nama}%0A✂️ *Treatment:* ${lay}%0A%0A💵 *Harga Normal:* Rp ${formatRp(harga)}%0A🏷️ *Diskon:* -Rp ${formatRp(diskon)}%0A💰 *Total Akhir:* Rp ${formatRp(total)}%0A--------------------------------%0A_Terima kasih atas kunjungannya, ditunggu kedatangannya kembali! ✨_`;
      window.open(`https://wa.me/${waHp}?text=${msg}`, '_blank');
      document.getElementById('inpNama').value = '';
      document.getElementById('inpHp').value = '';
      document.getElementById('inpLayanan').value = '';
      document.getElementById('inpHarga').value = '';
      document.getElementById('inpDiskon').value = '';
      document.getElementById('inpBayar').value = '';
      hitung();
      renderRiwayat();
    }

    async function hapus(id) {
      if(!confirm('Hapus nota ini?')) return;
      dTransaksi = dTransaksi.filter(t => t["ID Nota"] !== id);
      localStorage.setItem('alesha_data', JSON.stringify(dTransaksi));
      renderRiwayat();
      fetch(SHEETS_URL, { method: 'POST', body: JSON.stringify({ action: 'DELETE', idNota: id }) });
    }

    function showLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); }
    renderRiwayat();
    muatData();
  </script>
</body>
</html>
