<script>
    const SHEETS_URL = "https://script.google.com/macros/s/AKfycbwk13_OZwnmngluCPTFehZrcZaMcJngFQlUDMZXjUEeh196q1d3AfOV-HPiEDjc360yfQ/exec"; // Pastikan URL Anda tetap di sini
    let dTransaksi = [];
    let isDataLoaded = false;

    // FITUR BARU: Pencipta Suara "Ting!" Digital
    function putarSuaraTing() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine'; // Menghasilkan suara jernih seperti bel/kaca
        osc.frequency.setValueAtTime(1200, ctx.currentTime); // Nada tinggi
        
        gain.gain.setValueAtTime(0.5, ctx.currentTime); // Volume awal
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); // Efek suara memudar perlahan (echo)

        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.5); // Berhenti dalam setengah detik
      } catch (e) {
        console.log("Fitur suara tidak didukung", e);
      }
    }

    function formatRp(n) { return new Intl.NumberFormat('id-ID').format(n); }
    function clean(s) { return parseInt(s.replace(/\./g, '')) || 0; }
    function formatRpInput(i) { 
      let v = i.value.replace(/[^0-9]/g, '');
      i.value = v ? formatRp(v) : '';
    }

    function bukaTab(t) {
      document.querySelectorAll('.tab-konten').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-'+t).classList.remove('hidden');
      
      if(t === 'riwayat' && !isDataLoaded) {
        muatData();
      } else if (t === 'riwayat') {
        renderRiwayat(); 
      }
    }

    function hitung() {
      let h = clean(document.getElementById('inpHarga').value);
      let d = clean(document.getElementById('inpDiskon').value);
      let b = clean(document.getElementById('inpBayar').value);
      let t = Math.max(0, h - d);
      document.getElementById('txtTotal').innerText = 'Rp ' + formatRp(t);
      document.getElementById('txtKembali').innerText = 'Rp ' + formatRp(Math.max(0, b - t));
    }

    async function muatData() {
      showLoader(true);
      try {
        const res = await fetch(SHEETS_URL);
        dTransaksi = await res.json();
        isDataLoaded = true;
        renderRiwayat();
      } catch (e) {
        console.log("Gagal memuat:", e);
      }
      showLoader(false);
    }

    function renderRiwayat() {
      let h = '';
      dTransaksi.slice().reverse().forEach(t => {
        h += `<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                <div>
                  <p class="text-xs text-slate-400">${t.Tanggal}</p>
                  <p class="font-bold text-slate-700">${t.Pelanggan}</p>
                  <p class="text-xs text-pink-500">${t.Treatment}</p>
                </div>
                <div class="text-right">
                  <p class="font-black">Rp ${formatRp(t["Total Tagihan"])}</p>
                  <button onclick="hapus('${t["ID Nota"]}')" class="text-[10px] font-bold text-rose-500 bg-rose-50 px-2 py-1 rounded">Hapus</button>
                </div>
              </div>`;
      });
      document.getElementById('listRiwayat').innerHTML = h || '<p class="text-center text-slate-400 py-10">Belum ada transaksi</p>';
    }

    function simpan() {
      const nama = document.getElementById('inpNama').value;
      const hp = document.getElementById('inpHp').value;
      const lay = document.getElementById('inpLayanan').value;
      const harga = clean(document.getElementById('inpHarga').value);
      const diskon = clean(document.getElementById('inpDiskon').value);
      const bayar = clean(document.getElementById('inpBayar').value);
      const total = Math.max(0, harga - diskon);
      const kembalian = Math.max(0, bayar - total);

      if(!nama || !hp || !lay || harga <= 0) return alert('Lengkapi data ya Kak!');
      if(bayar > 0 && bayar < total) return alert('Uang bayar masih kurang nih.');
      
      // ✅ MEMAINKAN SUARA TING SAAT DATA VALID
      putarSuaraTing();

      let id = 'NOTA-' + Math.floor(Math.random()*10000);
      let waHp = hp.startsWith('0') ? '62' + hp.substring(1) : hp;
      let tglSekarang = new Date().toLocaleDateString('id-ID');

      showLoader(true);

      // Kirim ke cloud
      fetch(SHEETS_URL, {
        method: 'POST',
        body: JSON.stringify({
          tanggal: tglSekarang,
          idNota: id, pelanggan: nama, noWa: waHp, layanan: lay, diskon: diskon, totalAkhir: total
        })
      }).catch(e => console.log("Data aman dikirim di background", e));

      dTransaksi.push({
        "Tanggal": tglSekarang, "ID Nota": id, "Pelanggan": nama, "No WA": waHp, "Treatment": lay, "Diskon": diskon, "Total Tagihan": total
      });

      // WA & Reset Formulir
      setTimeout(() => {
        showLoader(false);
        
        let barisDiskon = '';
        if (diskon > 0) {
          barisDiskon = `%0A🏷️ *Diskon:* -Rp ${formatRp(diskon)}`;
        }

        const msg = `*NOTA SALON ALESHA* 💇‍♀️%0A--------------------------------%0A*ID Nota:* ${id}%0A*Tanggal:* ${tglSekarang}%0A%0A👤 *Pelanggan:* ${nama}%0A✂️ *Treatment:* ${lay}%0A%0A💵 *Harga Normal:* Rp ${formatRp(harga)}${barisDiskon}%0A💰 *Total Akhir:* Rp ${formatRp(total)}%0A💵 *Tunai:* Rp ${formatRp(bayar)}%0A💳 *Kembali:* Rp ${formatRp(kembalian)}%0A--------------------------------%0A_Terima kasih atas kunjungannya, ditunggu kedatangannya kembali! ✨_`;
        
        window.open(`https://wa.me/${waHp}?text=${msg}`, '_blank');
        
        // Bersihkan Kolom
        document.getElementById('inpNama').value = '';
        document.getElementById('inpHp').value = '';
        document.getElementById('inpLayanan').value = '';
        document.getElementById('inpHarga').value = '';
        document.getElementById('inpDiskon').value = '';
        document.getElementById('inpBayar').value = '';
        hitung(); 
        
        renderRiwayat();
      }, 500); 
    }

    function hapus(id) {
      if(!confirm('Hapus nota ini?')) return;
      
      dTransaksi = dTransaksi.filter(t => t["ID Nota"] !== id);
      renderRiwayat();

      fetch(SHEETS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'DELETE', idNota: id })
      }).catch(e => console.log(e));
    }

    function showLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); }
    
    muatData();
    bukaTab('kasir');
  </script>
