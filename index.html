<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Salon Alesha Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .tab-konten { display: none; }
    .tab-konten.active { display: block; animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="text-slate-800 antialiased">

  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-lg border-b border-slate-200/50 p-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">💇‍♀️</span>
        <h1 class="text-lg font-extrabold text-pink-600">Salon Alesha</h1>
      </div>
      <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="bukaTab(event, 'kasir')" class="nav-btn px-4 py-2 rounded-lg text-xs font-bold transition bg-white text-pink-600 shadow-sm">Kasir</button>
        <button onclick="bukaTab(event, 'riwayat')" class="nav-btn px-4 py-2 rounded-lg text-xs font-bold transition text-slate-500">Laporan</button>
      </div>
    </div>
  </nav>

  <div id="loader" class="hidden fixed inset-0 bg-white/60 backdrop-blur-sm z-[100] flex items-center justify-center font-bold text-pink-600 italic text-center px-4">
    <div class="p-5 bg-white rounded-2xl shadow-xl">Memproses Cloud... ☁️</div>
  </div>

  <div class="max-w-2xl mx-auto p-4">
    <div id="tab-kasir" class="tab-konten active space-y-4">
      <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-100">
        <h2 class="font-bold mb-4 flex items-center gap-2"><span class="bg-pink-100 p-1 rounded text-pink-600">📝</span> Transaksi Baru</h2>
        
        <input type="text" id="inpNama" class="w-full p-4 mb-3 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-pink-500" placeholder="Nama Pelanggan">
        <input type="tel" id="inpHp" class="w-full p-4 mb-3 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-pink-500" placeholder="No WA (0812...)">
        
        <select id="inpLayanan" class="w-full p-4 mb-3 bg-slate-50 rounded-2xl outline-none ring-1 ring-slate-100">
          <option value="">-- Pilih Treatment --</option>
          <option value="Potong Rambut">Potong Rambut</option>
          <option value="Cuci Catok / Blow">Cuci Catok / Blow</option>
          <option value="Creambath">Creambath</option>
          <option value="Hair Mask / Spa">Hair Mask / Spa</option>
          <option value="Smoothing / Matrix">Smoothing / Matrix</option>
          <option value="Coloring / Highlight">Coloring / Highlight</option>
          <option value="Eyelash / Nail Art">Eyelash / Nail Art</option>
          <option value="Lainnya (Custom)">Lainnya (Custom)</option>
        </select>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] font-bold text-slate-400 ml-2 uppercase">Harga (Rp)</label>
            <input type="text" inputmode="numeric" id="inpHarga" oninput="formatRpInput(this); hitung()" class="w-full p-4 bg-white border-2 border-pink-100 rounded-2xl font-bold text-pink-600 outline-none" placeholder="0">
          </div>
          <div>
            <label class="text-[10px] font-bold text-orange-400 ml-2 uppercase">Diskon (Rp)</label>
            <input type="text" inputmode="numeric" id="inpDiskon" oninput="formatRpInput(this); hitung()" class="w-full p-4 bg-orange-50 border border-orange-200 rounded-2xl text-orange-600 font-bold outline-none" placeholder="0">
          </div>
        </div>
      </div>

      <div class="bg-slate-900 text-white p-8 rounded-[2rem] shadow-2xl">
        <p class="text-slate-400 text-xs font-bold uppercase mb-1">Total Bayar</p>
        <h3 id="txtTotal" class="text-4xl font-black text-pink-400 mb-6">Rp 0</h3>
        
        <div class="space-y-4">
          <input type="text" inputmode="numeric" id="inpBayar" oninput="formatRpInput(this); hitung()" class="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 font-bold text-xl text-white outline-none" placeholder="Uang Tunai...">
          <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-2xl">
            <span class="text-xs text-slate-400">Kembalian:</span>
            <span id="txtKembali" class="font-bold text-xl text-emerald-400">Rp 0</span>
          </div>
        </div>

        <button onclick="simpan()" class="w-full mt-6 bg-gradient-to-r from-pink-500 to-rose-600 py-5 rounded-2xl font-extrabold shadow-lg shadow-pink-500/30 active:scale-95 transition-all flex items-center justify-center gap-2">
          SIMPAN & KIRIM NOTA 📲
        </button>
      </div>
    </div>

    <div id="tab-riwayat" class="tab-konten space-y-4">
      <div id="listRiwayat" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const SHEETS_URL = "https://script.google.com/macros/s/AKfycbwk13_OZwnmngluCPTFehZrcZaMcJngFQlUDMZXjUEeh196q1d3AfOV-HPiEDjc360yfQ/exec"; 
    let dTransaksi = JSON.parse(localStorage.getItem('alesha_data')) || [];

    function putarSuaraTing() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(1200, ctx.currentTime);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    function formatRp(n) { return new Intl.NumberFormat('id-ID').format(n); }
    function clean(s) { return parseInt(s.replace(/\./g, '')) || 0; }
    function formatRpInput(i) { 
      let v = i.value.replace(/[^0-9]/g, '');
      i.value = v ? formatRp(v) : '';
    }

    function bukaTab(e, t) {
      document.querySelectorAll('.tab-konten').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-'+t).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-pink-600', 'shadow-sm');
        btn.classList.add('text-slate-500');
      });
      if(e) e.currentTarget.classList.add('bg-white', 'text-pink-600', 'shadow-sm');
      if(t === 'riwayat') renderRiwayat();
    }

    function hitung() {
      let h = clean(document.getElementById('inpHarga').value);
      let d = clean(document.getElementById('inpDiskon').value);
      let b = clean(document.getElementById('inpBayar').value);
      let t = Math.max(0, h - d);
      document.getElementById('txtTotal').innerText = 'Rp ' + formatRp(t);
      document.getElementById('txtKembali').innerText = 'Rp ' + formatRp(Math.max(0, b - t));
    }

    async function muatData() {
      if(dTransaksi.length === 0) showLoader(true);
      try {
        const res = await fetch(SHEETS_URL);
        dTransaksi = await res.json();
        localStorage.setItem('alesha_data', JSON.stringify(dTransaksi));
        renderRiwayat();
      } catch (e) {}
      showLoader(false);
    }

    function renderRiwayat() {
      let h = '';
      dTransaksi.slice().reverse().forEach(t => {
        h += `<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                <div>
                  <p class="text-[10px] text-slate-400 font-bold">${t.Tanggal} • ${t["ID Nota"] || 'NOTA'}</p>
                  <p class="font-bold text-slate-700">${t.Pelanggan}</p>
                  <p class="text-xs text-pink-500 font-medium">${t.Treatment}</p>
                </div>
                <div class="text-right">
                  <p class="font-black text-slate-800">Rp ${formatRp(t["Total Tagihan"])}</p>
                  <button onclick="hapus('${t["ID Nota"]}')" class="text-[10px] font-bold text-rose-500 bg-rose-50 px-2 py-1 rounded-lg mt-1">Hapus</button>
                </div>
              </div>`;
      });
      document.getElementById('listRiwayat').innerHTML = h || '<p class="text-center text-slate-400 py-10">Belum ada transaksi</p>';
    }

    async function simpan() {
      const nama = document.getElementById('inpNama').value;
      const hp = document.getElementById('inpHp').value;
      const lay = document.getElementById('inpLayanan').value;
      const harga = clean(document.getElementById('inpHarga').value);
      const diskon = clean(document.getElementById('inpDiskon').value);
      const bayar = clean(document.getElementById('inpBayar').value);
      const total = harga - diskon;

      if(!nama || !hp || !lay || harga <= 0) return alert('Lengkapi data ya!');
      
      putarSuaraTing();
      let id = 'NOTA-' + Math.floor(Math.random()*9000 + 1000);
      let waHp = hp.startsWith('0') ? '62' + hp.substring(1) : hp;
      let tgl = new Date().toLocaleDateString('id-ID');

      // Simpan Lokal & Background Cloud
      dTransaksi.push({ "Tanggal": tgl, "ID Nota": id, "Pelanggan": nama, "No WA": waHp, "Treatment": lay, "Diskon": diskon, "Total Tagihan": total });
      localStorage.setItem('alesha_data', JSON.stringify(dTransaksi));

      fetch(SHEETS_URL, {
        method: 'POST',
        body: JSON.stringify({ tanggal: tgl, idNota: id, pelanggan: nama, noWa: waHp, layanan: lay, diskon: diskon, totalAkhir: total })
      });

      // NOTA KOMPLIT
      let barisDiskon = diskon > 0 ? `%0A🏷️ *Diskon:* -Rp ${formatRp(diskon)}` : "";
      const msg = `*NOTA SALON ALESHA* 💇‍♀️%0A--------------------------------%0A*ID Nota:* ${id}%0A*Tanggal:* ${tgl}%0A%0A👤 *Pelanggan:* ${nama}%0A✂️ *Treatment:* ${lay}%0A%0A💵 *Harga Normal:* Rp ${formatRp(harga)}${barisDiskon}%0A💰 *Total Akhir:* Rp ${formatRp(total)}%0A--------------------------------%0A_Terima kasih! ✨_`;

      window.open(`https://wa.me/${waHp}?text=${msg}`, '_blank');
      
      // Reset Form Tanpa Reload
      document.getElementById('inpNama').value = '';
      document.getElementById('inpHp').value = '';
      document.getElementById('inpHarga').value = '';
      document.getElementById('inpDiskon').value = '';
      document.getElementById('inpBayar').value = '';
      hitung();
    }

    async function hapus(id) {
      if(!confirm('Hapus nota ini?')) return;
      dTransaksi = dTransaksi.filter(t => t["ID Nota"] !== id);
      localStorage.setItem('alesha_data', JSON.stringify(dTransaksi));
      renderRiwayat();
      fetch(SHEETS_URL, { method: 'POST', body: JSON.stringify({ action: 'DELETE', idNota: id }) });
    }

    function showLoader(s) { document.getElementById('loader').classList.toggle('hidden', !s); }
    renderRiwayat();
    muatData();
  </script>
</body>
</html>
